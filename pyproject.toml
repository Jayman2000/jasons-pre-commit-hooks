# editorconfig-checker-disable
# SPDX-FileCopyrightText: 2024, 2026 Jason Yundt <jason@jasonyundt.email>
# editorconfig-checker-enable

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools-scm"
]

[project]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "dulwich",
    "identify",
    "PyYAML",
    "python-dateutil",
    "semver",
    "wcwidth"
]
description = "Hooks for <https://pre-commit.com>"
name = "jasons-pre-commit-hooks-python"
requires-python = ">=3.12"
version = "0.0.0"

# This file doesn’t really contain a license. Instead, it contains the
# repo’s copying information.
[project.license]
file = "copying.md"

# editorconfig-checker-disable
[project.scripts]
detect-bad-unicode = "jasons_pre_commit_hooks_python.detect_bad_unicode:main"
flake-lock-updater = "jasons_pre_commit_hooks_python.flake_lock_updater:main"
forbid-paths-that-match = "jasons_pre_commit_hooks_python.forbid_paths_that_match:main"
gitignore-generator = "jasons_pre_commit_hooks_python.gitignore_generator:main"
old-subtree-alert = "jasons_pre_commit_hooks_python.old_subtree_alert:main"
repo-style-checker = "jasons_pre_commit_hooks_python.repo_style_checker:main"
unreleased-commit-checker = "jasons_pre_commit_hooks_python.unreleased_commit_checker:main"

# editorconfig-checker-enable
[project.urls]
Homepage = "https://github.com/Jayman2000/jasons-pre-commit-hooks"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"

[tool.setuptools]
include-package-data = true
packages = ["jasons_pre_commit_hooks_python"]

[tool.setuptools_scm]
