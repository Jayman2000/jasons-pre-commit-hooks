%YAML 1.2
---
# SPDX-License-Identifier: CC0-1.0
# yamllint disable-line rule:line-length
# SPDX-FileCopyrightText: 2024, 2026 Jason Yundt <jason@jasonyundt.email>
-
    id: &id1 detect-bad-unicode
    name: *id1
    entry: *id1
    language: python
    types: [text]
    description: Checks to see if UTF-8 files contain “bad” code points
-
    id: &id2 flake-lock-updater
    name: *id2
    entry: *id2
    always_run: true
    pass_filenames: false
    language: python
    description: >-
        Runs “nix flake update” if any inputs in flake.lock are over a
        week old.
-
    id: &id3 forbid-paths-that-match
    name: *id3
    entry: *id3
    language: python
    description: Causes an error if paths match certain regex patterns
-
    id: &id4 repo-style-checker
    name: *id4
    entry: *id4
    language: python
    pass_filenames: false
    description: Makes sure that repos follow Jason’s style for repos
-
    id: &id5 unreleased-commit-checker
    name: *id5
    entry: *id5
    language: python
    pass_filenames: false
    description: >-
        Tells you how many unreleased commits there are and gives an
        error if a release needs to be made.
-
    id: &id6 forbid-template-markers
    name: *id5
    # Eventually, we’re going to start running forbid-template-markers
    # on the Jason’s Pre-commit Hooks repository. I’m using a \u escape
    # here in order to make sure that a false positive doesn’t get
    # triggered for this file.
    entry: "placeholder-\u0445𭢸눳🕛𫨖-placeholder"
    language: pygrep
-
    id: &id7 check-if-rust-edition-is-old
    name: *id7
    entry: *id7
    language: rust
    always_run: true
    pass_filenames: false
    description: >-
        Make sures that your Cargo.toml files are set to use the latest
        Rust edition.
-
    id: &id8 old-subtree-alert
    name: *id8
    entry: *id8
    language: python
    always_run: true
    pass_filenames: false
    description: Gives errors when Git subtrees are too old.
-
    id: &id9 gitignore-generator
    name: *id9
    entry: *id9
    language: python
    always_run: true
    verbose: true
    pass_filenames: false
    description: >-
        Automatically generates a gitignore file based on the contents
        of your repo.
-
    # TODO: This should be removed if this upstream cargo-edit feature
    # request [1] gets implemented.
    #
    # [1]: <TODO: File the upstream feature request>
    id: &id10 cargo-upgrade
    name: *id10
    # When creating a Rust pre-commit hook that depends on a Rust binary
    # that’s from an external package, you would normally add an
    # additional_dependencies entry that looks something like this:
    #
    # additional_dependencies: "cli:cargo-edit:0.13.13"
    #
    # (See this part of pre-commit’s documentation [1]).
    #
    # If I were to do that, then I would need to figure out a way to
    # make sure that that the version number in that
    # additional_dependencies line gets kept up to date. Instead of
    # figuring that out, I have decided to use a shim. That way, I can
    # just rely on the existing mechanisms for keeping Cargo.toml and
    # Cargo.lock files up to date.
    #
    # [1]: <https://pre-commit.com#rust>
    entry: shim-for-cargo-upgrade
    args:
        - upgrade
    language: rust
    always_run: true
    pass_filenames: false
    description: Updates version ranges in Cargo.toml files.
